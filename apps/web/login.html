<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电缆桥架力学分析一体化平台 - 登录</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d141d;
      --foreground: #e8eef5;
      --muted-foreground: #9aa8b8;
      --border: #2a3441;
      --card: #141b23;
      --muted: #354253;
      --viz-series-1: #6aa9f4;
      --viz-series-2: #bc8b70;
      --viz-series-6: #58aa9f;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font: 14px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    button, input { font: inherit; letter-spacing: 0; }
    #ct-login-hero-v3 { width: min(100vw, calc(100svh * 16 / 9)); }
    #ct-login-hero-v3 .form-label {
      color: var(--foreground);
      font-size: 13px;
      font-weight: 500;
    }
    #ct-login-hero-v3 .form-control {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid #46515f;
      border-radius: 8px;
      outline: none;
      color: var(--foreground);
      background: #252c35;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    #ct-login-hero-v3 .form-control::placeholder { color: #7e8997; opacity: 1; }
    #ct-login-hero-v3 .form-control:hover { border-color: #647286; }
    #ct-login-hero-v3 .form-control:focus {
      border-color: var(--viz-series-1);
      background: #202832;
      box-shadow: 0 0 0 3px rgba(106, 169, 244, .15);
    }
    #ct-login-hero-v3 .form-check {
      display: inline-flex;
      align-items: center;
      gap: .55em;
      cursor: pointer;
    }
    #ct-login-hero-v3 .form-check-input {
      width: 1.1em;
      height: 1.1em;
      margin: 0;
      accent-color: var(--viz-series-1);
    }
    #ct-login-hero-v3 .btn {
      min-height: 48px;
      border: 1px solid #dce6f0;
      border-radius: 8px;
      color: #111820;
      background: #e5edf5;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, opacity .16s ease;
    }
    #ct-login-hero-v3 .btn:hover:not(:disabled) { background: #ffffff; border-color: #ffffff; }
    #ct-login-hero-v3 .btn:focus-visible { outline: 3px solid rgba(106, 169, 244, .45); outline-offset: 2px; }
    #ct-login-hero-v3 .btn:disabled { cursor: wait; opacity: .66; }
    #ct-login-hero-v3 .btn-block { width: 100%; }
    #ct-login-hero-v3 .ct-v3-status {
      min-height: 1.5em;
      color: #ff9b9b;
      font-size: 12px;
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      #ct-login-hero-v3 { width: 100%; min-height: 100svh; }
      #ct-login-hero-v3 .ct-login-stage { min-height: 100svh; aspect-ratio: auto; }
      #ct-login-hero-v3 .ct-login-art {
        position: absolute;
        inset: 0 auto 0 50%;
        width: auto;
        height: 100%;
        min-width: 177.78svh;
        transform: translateX(-50%);
        opacity: .28;
      }
      #ct-login-hero-v3 .ct-v3-login {
        left: 7% !important;
        top: 7% !important;
        width: 86% !important;
        max-width: 460px;
      }
      #ct-login-hero-v3 .ct-v3-login > p,
      #ct-login-hero-v3 .ct-v3-form-row { display: flex !important; }
      #ct-login-hero-v3 .ct-v3-help { display: grid !important; }
      #ct-login-hero-v3 .ct-v3-form { gap: 10px !important; }
      #ct-login-hero-v3 h1 { font-size: 38px; }
      #ct-login-hero-v3 .form-control,
      #ct-login-hero-v3 .btn { min-height: 48px; }
    }
  </style>
</head>

    #ct-login-hero-v3 .ct-v3-help { width: 100%; }
  }
</style>
<script>
  const form = document.getElementById("loginForm");
  const statusEl = document.getElementById("status");
  const button = document.getElementById("loginButton");
  const usernameInput = document.getElementById("username");
  const rememberInput = document.getElementById("rememberAccount");
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next") || "/";
  const rememberedUsername = localStorage.getItem("cabletray_login_username") || "";

  if (rememberedUsername) {
    usernameInput.value = rememberedUsername;
    rememberInput.checked = true;
    document.getElementById("password").focus();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    statusEl.textContent = "";
    button.disabled = true;
    button.textContent = "正在登录...";
    const username = usernameInput.value.trim();
    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          password: form.password.value,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || "账号或密码错误");
      if (rememberInput.checked) localStorage.setItem("cabletray_login_username", username);
      else localStorage.removeItem("cabletray_login_username");
      window.location.href = next.startsWith("/") ? next : "/";
    } catch (error) {
      statusEl.textContent = error.message || "登录失败";
      button.disabled = false;
      button.textContent = "登录";
    }
  });
</script>
